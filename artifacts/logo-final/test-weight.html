<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; background:#050608; color:#E9EFF8; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  body { padding:40px; }
  h1 { font-size:15px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:#8D99AB; margin:0 0 28px; }
  .row { display:flex; gap:28px; align-items:flex-start; }
  .case { width:300px; }
  .icon { width:300px; height:300px; border-radius:64px; overflow:hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .label { margin-top:14px; font-size:12px; color:#7E8B9E; letter-spacing:.08em; text-transform:uppercase; }
  svg { display:block; width:100%; height:100%; }
  .sizes { display:flex; gap:18px; align-items:flex-end; margin-top:50px; }
  .size { text-align:center; color:#6E7A8C; font-size:11px; letter-spacing:.1em; }
  .size .tile { margin:0 auto 10px; border-radius:22%; overflow:hidden; background:#07080C; }
</style>
</head>
<body>
