<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#111;overflow:hidden}
  .stage{width:1024px;height:1024px;overflow:hidden}
  svg{display:block;width:1024px;height:1024px}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#11151E"/>
      <stop offset=".46" stop-color="#080A0F"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="ambient" cx=".47" cy=".36" r=".68">
      <stop offset="0" stop-color="#D9E7FA" stop-opacity=".10"/>
      <stop offset=".58" stop-color="#A9BBD4" stop-opacity=".028"/>
      <stop offset="1" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="55" y1="35" x2="188" y2="205">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset=".15" stop-color="#D8E4F5"/>
      <stop offset=".38" stop-color="#A9BAD0"/>
      <stop offset=".58" stop-color="#7C8DA5"/>
      <stop offset=".75" stop-color="#A9BCD2"/>
      <stop offset=".89" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#C3D2E4"/>
    </linearGradient>
    <radialGradient id="spec" cx=".34" cy=".2" r=".55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx=".34" cy=".3" r=".8">
      <stop offset="0" stop-color="#E65067"/>
      <stop offset=".46" stop-color="#C2243D"/>
      <stop offset="1" stop-color="#8E1428"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE9FA" stop-opacity=".04"/>
      <stop offset=".28" stop-color="#DDE9FA" stop-opacity=".38"/>
      <stop offset=".58" stop-color="#8D9CB0" stop-opacity=".12"/>
      <stop offset=".85" stop-color="#E6F1FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E6F1FF" stop-opacity=".10"/>
    </linearGradient>
    <mask id="rStroke" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <rect width="240" height="240" fill="#000"/>
      <g transform="translate(-3.5 5.5)">
        <path d="M 70 196 V 44 H 118 C 153 44 176 60 176 82 C 176 104 153 118 118 118 L 94 118 L 177 196"
              fill="none" stroke="#fff" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter"/>
      </g>
    </mask>
    <mask id="orbitMask" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <rect width="240" height="240" fill="#fff"/>
      <g transform="translate(-3.5 5.5)">
        <path d="M 70 196 V 44 H 118 C 153 44 176 60 176 82 C 176 104 153 118 118 118 L 94 118 L 177 196"
              fill="none" stroke="#000" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter"/>
        <path d="M 79 53 H 152 C 161 53 167 60 167 69 V 93 C 167 102 161 109 152 109 H 79 Z" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <rect width="240" height="240" fill="url(#ambient)"/>
  <ellipse cx="120" cy="120" rx="95" ry="39" transform="rotate(-20 120 120)" fill="none" stroke="url(#orbit)" stroke-width="1.6" mask="url(#orbitMask)"/>
  <g transform="translate(-3.5 5.5)">
    <path d="M 70 196 V 44 H 118 C 153 44 176 60 176 82 C 176 104 153 118 118 118 L 94 118 L 177 196"
          fill="none" stroke="url(#silver)" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter"/>
    <rect x="0" y="0" width="240" height="240" fill="url(#spec)" mask="url(#rStroke)"/>
    <circle cx="143" cy="82" r="6.5" fill="url(#dot)"/>
  </g>
</svg>
</div>
</body>
</html>
